# =========================================================
# Configuracion de la aplicacion ApiPaises
# =========================================================

# --- Base de datos MySQL ---
# Local:
db.url=jdbc:mysql://localhost:3306/api_paises?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# En la nube (AWS RDS), solo cambia el host, por ejemplo:
# db.url=jdbc:mysql://api-paises.xxxxxxxx.us-east-1.rds.amazonaws.com:3306/api_paises?useSSL=true
db.user=monster
db.password=monster

# --- API REST Countries v5 ---
# La v3.1 del enunciado fue retirada. La v5 necesita una API key gratuita:
# crear cuenta en https://restcountries.com/sign-up y pegarla aqui.
# Si se deja vacia, la app usa el dataset abierto de respaldo (mismos datos).
api.key=
